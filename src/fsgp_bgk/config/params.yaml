#ros
cloud_topic: '/simulated_lidar_local'  
odom_topic: '/odom'  
global_link: 'map'  
#map
max_cloud_height: 0.5  
downsampl_voxel_size: 0.2 
binarization_condition: True 
obstacle_threshold: 0.5 
occupancy_threshold: 0.5  
decay_rate: 1  
smooth_kernel_size: 3  
map_update_rate: 4.0 # Timer PERIOD in s. CPU-only compute takes ~3.8-4.2 s/frame, so 4.0 matches the real rate (>= Nav2 0.2 Hz)
publish_resolution: 0.2 # = resolution, so publish step does not interpolate
#keypoints
curvature_threshold: 0 
gradient_threshold: 0
key_voxel_size: 0.1 
inducing_points: 500 
#hyperparameters
open_pca: False
lengthscale: 0.1  # only used if apply_kernel_init: True (initial value for every input's lengthscale, ARD)
alpha: 10         # only used if apply_kernel_init: True (initial RQ alpha)
apply_kernel_init: True  # False = original behaviour: RQKernel ignores lengthscale/alpha, both start at 0.693
gp_train_iters: 50  # AdamW steps on the marginal likelihood per frame (original: 1)
gp_lr: 0.1          # original: 0.01
gp_noise_init: 0.0004  # initial GP likelihood noise variance [m^2], still trained; -1 = GPyTorch default (0.693).
                    # 0.0004 = lidar_range_std^2. These four GP settings chosen 2026-10-23 (docs/map_variability_action_plan.md,
                    # item 8): ~3 s/frame on LuSNAR, over the 4 s map_update_rate in forest
#base
resolution: 0.2
x_length: 5 
y_length: 5 
i_num: 15
base_height: 0.0
#trv
# Normalisation limits (factor = 1 at max_*), from the rover's capabilities: docs/normalisation_limits_derivation.md
max_slope: 0.268  # tan(15 deg), rover max slope; |grad z| (rise / run), absolute with level_cloud: True (was 0.8, 38.7 deg)
min_slope: 0.0
test_slope: 0
max_flatness: 0.013 # flatness feature on 14 cm rocks (MoonRanger belly-strike high risk), on-rock cells, correct lidar, 2026-10-24 (results/limit_calibration_v2; was 0.0135 diluted mask, 0.012 stale lidar, 0.1 original)
min_flatness: 0.0
test_flatness: 0
max_height: 0.045 # step-height feature on the edge of a 10 cm step (MoonRanger wheel high risk), correct lidar, 2026-10-24 (results/limit_calibration_v2; was 0.0385 diluted mask, 0.032 stale lidar, 0.1 original)
min_height: 0.0
test_height: 0
max_uncertainty: 1.6 # Change this
min_uncertainty: 0.64 # Change this
test_uncertainty: 0
w_slope: 0.4  # Change this
w_flatness: 0.3 # Change this
w_step_height: 0.3 # Change this
time_window: 600 # Change this
max_history_frames: 3
bgk_threshold: 0.8
#sampling (per-cell traversability distribution)
num_samples: 20             # N Monte Carlo samples per cell; 0 disables sampling
knn_k: 20                   # neighbourhood size for curvature/gradient features and bootstrap
lidar_range_std: 0.02       # sigma_r [m], Livox MID-360 range precision @10 m (1 sigma)
lidar_angular_std_deg: 0.15 # sigma_theta [deg], Livox MID-360 angular precision (1 sigma)
sample_seed: 0              # -1 = unseeded; >= 0 for reproducible runs (N convergence study). 0 for now (2026-10-23) so before / after tests differ only by lidar noise
grad_cov_jitter: 1.0e-8     # added to posterior gradient covariance diagonal before Cholesky
smooth_sample_slope: False  # apply calculate_slope's gaussian_filter to sampled gradients (shrinks spread)
publish_risk_factors: True # False # also store + publish slope/flatness/step-height sample distributions on /risk_factor_pcl
publish_raw_risk_factors: False # also publish each factor's value before normalisation (after smoothing) on /risk_factor_raw_pcl (complete_map_planning.py turns it on for its survey)
edge_lethal: False          # True = original: window edge (r > 2.1 m) and corners published as cost 1 (lethal); False = unknown (NaN -> -1 downstream) so a global planner can plan beyond the edge
level_cloud: True           # rotate each cloud by the robot's roll / pitch first, so slope is against gravity; False = original (relative to the robot's body, which the simulator tilts to the ground)
robot_points_in_features: False  # True = original: robot points (curvature / gradient 0) in the feature interpolation; False = real key points only (docs/lidar_robot_points_coverage_plan.md, set 2026-10-23)
robot_points_extent: [0.612, 0.58]  # robot-point area [length (x, forward), width (y)] in m, or one value for a square; 0 = whole window (original). Rover footprint 612 x 580 mm (set 2026-10-24)