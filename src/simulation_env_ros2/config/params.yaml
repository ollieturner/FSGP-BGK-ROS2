# Simulation Environment Parameters (ROS2)
simulation_node:
  ros__parameters:
    # Initial pose
    init_x: 0.0
    init_y: 0.0
    init_z: 0.0

    # Robot model
    mesh_resource: "package://simulation_env/meshes/robot.dae"
    mesh_scale: 0.001     # robot.dae is in mm (629 x 580 x 225), so 0.001 = real size (rover 612 x 580 x 245 mm); was 0.0005 (half size)
    mesh_offset_x: -0.326 # mesh origin is at a corner: -(bounding-box centre) at scale 0.001, so the model is centred on the pose (was -0.15)
    mesh_offset_y: -0.315 # (was -0.16)

    # Control
    max_linear_vel: 1.0
    max_angular_vel: 3.14159
    control_rate: 50.0

    # Point cloud
    pcd_file_path: "src/simulation_env_ros2/PCD/forest.pcd" # Change to local relative path
    search_radius: 0.2
    min_neighbors: 5
    height_offset: 0.0